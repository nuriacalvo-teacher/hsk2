# Graba los audios (dictados, listenings y lecturas) con voces neuronales
# chinas y los sube al repositorio.
#
# Se lanza desde la pestaña "Actions" de GitHub → "Grabar los audios" →
# botón "Run workflow". No hace falta instalar nada.
#
# La primera vez tarda unos 30-45 minutos (unos 600 audios x 3 velocidades).
# Después solo graba lo nuevo o lo que haya cambiado.

name: Grabar los audios

on:
  workflow_dispatch:
    inputs:
      muestra:
        description: 'Solo una muestra de 1 minuto con las voces elegidas'
        type: boolean
        required: false
        default: false
      comparativa:
        description: 'Solo una comparativa con TODAS las voces chinas, para elegir'
        type: boolean
        required: false
        default: false
      only:
        description: 'Solo estos audios (opcional). Ej: L05a L05b R2-03'
        required: false
        default: ''
      force:
        description: 'Regrabar aunque el audio ya exista'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: grabar-audios
  cancel-in-progress: false

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar edge-tts
        run: python -m pip install --upgrade pip edge-tts

      - name: Generar los datos de la app
        run: python3 tools/build_data.py

      - name: Grabar una muestra de las voces elegidas
        if: ${{ inputs.muestra && !inputs.comparativa }}
        run: python3 tools/build_audio.py --demo

      - name: Grabar la comparativa de todas las voces
        if: ${{ inputs.comparativa }}
        run: python3 tools/build_audio.py --audition

      - name: Dejar el audio listo para descargar
        if: ${{ inputs.muestra || inputs.comparativa }}
        uses: actions/upload-artifact@v4
        with:
          name: voces-para-escuchar
          path: |
            audio/muestra-voces.mp3
            audio/comparativa-voces.mp3
          if-no-files-found: error
          retention-days: 7

      - name: Grabar los audios
        if: ${{ !inputs.muestra && !inputs.comparativa }}
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          ARGS=()
          if [ -n "${ONLY}" ]; then
            # shellcheck disable=SC2206
            ARGS+=(--only ${ONLY})
          fi
          if [ "${FORCE}" = "true" ]; then
            ARGS+=(--force)
          fi
          # Si algún audio falla se reintenta una vez; lo ya grabado se conserva.
          python3 tools/build_audio.py "${ARGS[@]}" || python3 tools/build_audio.py "${ARGS[@]}" || true

      - name: Subir los audios al repositorio
        if: ${{ !inputs.muestra && !inputs.comparativa }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio js data
          if git diff --staged --quiet; then
            echo 'No hay audios nuevos que subir.'
            exit 0
          fi
          git commit -m 'Audios grabados automáticamente'
          git pull --rebase
          git push

      - name: Resumen
        if: ${{ always() && !inputs.muestra && !inputs.comparativa }}
        run: |
          if [ -f audio/manifest.json ]; then
            python3 -c "import json; d=json.load(open('audio/manifest.json'))['files']; t=sum(f['normal']['d'] for f in d.values() if 'normal' in f); print('## Audios\\n\\n- Audios grabados: **%d** (x3 velocidades)\\n- Duración a velocidad normal: **%d min**' % (len(d), t//60))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Audios' >> "$GITHUB_STEP_SUMMARY"
            echo 'No se generó ningún audio. Revisa el registro del paso anterior.' >> "$GITHUB_STEP_SUMMARY"
          fi
